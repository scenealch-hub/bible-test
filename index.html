<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>요한계시록 5~8장 암송시험</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  margin:0;background:#f7f4ef;color:#222;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  container-type:inline-size;
  max-width:900px;margin:0 auto;
  padding:16px 14px calc(24px + env(safe-area-inset-bottom));
}
h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 10px}
.card{background:#fff;padding:18px 16px;border-radius:16px;box-shadow:0 3px 15px #0000000f;margin:14px 0}
.small{color:#666;font-size:14px}
.hidden{display:none}
.ok{color:#16823b}.bad{color:#b42318}

/* 컨트롤: 모바일에서는 세로로 꽉 차게 */
.field{display:block;margin:14px 0}
.field > span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
select,textarea{
  width:100%;font-size:16px;padding:12px;border-radius:12px;
  border:1px solid #d6d0c6;background:#fff;color:#222;font-family:inherit;
}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#666 50%),linear-gradient(135deg,#666 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}
button{
  font-size:16px;font-family:inherit;padding:12px 16px;border-radius:12px;border:1px solid #222;
  background:#222;color:#fff;cursor:pointer;min-height:48px;touch-action:manipulation;
}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.secondary{background:#f0ece5;color:#222;border-color:#ddd6cb}
.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > button{flex:1 1 140px}

/* 절 선택 */
.pickerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pickerHead button{padding:8px 12px;min-height:40px;font-size:14px}
.chapterTitle{font-weight:700;margin:14px 0 8px;font-size:15px}
.verseGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.verseBtn{padding:0;min-height:48px;font-size:15px;background:#f0ece5;color:#222;border:1px solid #ddd6cb;border-radius:10px}
.verseBtn.on{background:#222;color:#fff;border-color:#222}

/* 시험 화면 */
#progress{font-size:14px;color:#666;margin-bottom:10px}
#question{font-size:19px;line-height:1.9;white-space:pre-wrap;word-break:keep-all;margin-bottom:14px}
textarea{min-height:150px;line-height:1.8}
#result{margin-top:14px}
.answerBox{background:#faf8f4;border:1px solid #eee6da;border-radius:12px;padding:14px;margin-top:10px;line-height:1.9;word-break:keep-all}
.actions{
  position:sticky;bottom:0;background:#fff;padding:12px 0 calc(4px + env(safe-area-inset-bottom));
  margin-top:12px;border-top:1px solid #f0ece5;
}

@container (min-width:640px){
  .wrap{padding:24px}
  .card{padding:24px}
  h1{font-size:26px}
  .controls{display:flex;gap:16px}
  .controls .field{flex:1}
}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h1>📖 요한계시록 5~8장 암송시험</h1>
  <p class="small" style="margin:0">개역한글 · 제공된 본문 기준</p>

  <div class="controls">
    <label class="field"><span>범위</span>
      <select id="range">
        <option value="all">5~8장 전체</option>
        <option value="5">5장</option><option value="6">6장</option>
        <option value="7">7장</option><option value="8">8장</option>
      </select>
    </label>
    <label class="field"><span>방식</span>
      <select id="mode">
        <option value="first_random">앞부분 보고 이어쓰기 · 랜덤</option>
        <option value="first_order">앞부분 보고 이어쓰기 · 순서대로</option>
        <option value="blank_random">빈칸 채우기 · 랜덤</option>
        <option value="blank_order">빈칸 채우기 · 순서대로</option>
        <option value="whole_random">절 전체 암송 · 랜덤</option>
        <option value="whole_order">절 전체 암송 · 순서대로</option>
        <option value="block_all">통째로 쓰기</option>
      </select>
    </label>
  </div>

  <div class="field">
    <div class="pickerHead">
      <span style="font-weight:700;font-size:14px">시험할 절 선택 <span id="selCount" class="small"></span></span>
      <div class="row" style="flex:0 0 auto">
        <button type="button" class="secondary" id="selectAll">전체 선택</button>
        <button type="button" class="secondary" id="clearAll">선택 해제</button>
      </div>
    </div>
    <p class="small" style="margin:0 0 8px">선택하지 않으면 해당 장의 모든 절이 출제됩니다.</p>
    <div id="verseButtons"></div>
  </div>

  <button class="block" id="startBtn">시험 시작</button>
  <p id="startMsg" class="bad small hidden" style="margin:10px 0 0"></p>
</div>

<div id="exam" class="card hidden">
  <div id="progress"></div>
  <div id="question"></div>
  <textarea id="answer" placeholder="여기에 암송한 내용을 입력하세요." autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  <div id="result"></div>
  <div class="actions row">
    <button id="gradeBtn">채점</button>
    <button class="secondary" id="answerBtn">정답 보기</button>
    <button class="secondary" id="nextBtn">다음 문제</button>
  </div>
</div>

<div id="summary" class="card hidden"></div>

"네째 천사가 나팔을 부니 해 삼분의 일과 달 삼분의 일과 별들의 삼분의 일이 침을 받아 그 삼분의 일이 어두워지니 낮 삼분의 일은 비췸이 없고 밤도 그러하더라",
"내가 또 보고 들으니 공중에 날아가는 독수리가 큰 소리로 이르되 땅에 거하는 자들에게 화, 화, 화가 있으리로다 이 외에도 세 천사의 불 나팔소리를 인함이로다 하더라"]
};

const $ = id => document.getElementById(id);
let qs = [], idx = 0, scores = [], selectedVerses = {};

/* ---------- 절 선택 ---------- */
function activeChapters(){
  const r = $('range').value;
  return Object.keys(raw).filter(k => r === 'all' || k === r);
}
function updateCount(){
  const n = activeChapters().reduce((sum, ch) =>
    sum + raw[ch].filter((_, i) => selectedVerses[ch + ':' + (i + 1)]).length, 0);
  $('selCount').textContent = n ? '(' + n + '절 선택됨)' : '';
}
function buildVersePicker(){
  const box = $('verseButtons');
  box.innerHTML = '';
  activeChapters().forEach(ch => {
    const title = document.createElement('div');
    title.className = 'chapterTitle';
    title.textContent = ch + '장';
    box.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'verseGrid';
    raw[ch].forEach((_, i) => {
      const v = i + 1, key = ch + ':' + v;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'verseBtn' + (selectedVerses[key] ? ' on' : '');
      b.textContent = v;
      b.setAttribute('aria-pressed', !!selectedVerses[key]);
      b.addEventListener('click', () => {
        selectedVerses[key] = !selectedVerses[key];
        b.classList.toggle('on', !!selectedVerses[key]);
        b.setAttribute('aria-pressed', !!selectedVerses[key]);
        updateCount();
      });
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
  updateCount();
}

/* ---------- 시험 진행 ---------- */
function start(){
  const mode = $('mode').value;
  const chapters = activeChapters();
  const hasSelection = chapters.some(ch => raw[ch].some((_, i) => selectedVerses[ch + ':' + (i + 1)]));
  let arr = [];

  if(mode === 'block_all'){
    chapters.forEach(ch => {
      const verses = raw[ch].map((text, i) => ({v: i + 1, text}))
        .filter(x => !hasSelection || selectedVerses[ch + ':' + x.v]);
      if(verses.length){
        arr.push({ch, vStart: verses[0].v, vEnd: verses[verses.length - 1].v,
                  text: verses.map(x => x.text).join(' ')});
      }
    });
  } else {
    chapters.forEach(ch => raw[ch].forEach((text, i) => {
      if(!hasSelection || selectedVerses[ch + ':' + (i + 1)]) arr.push({ch, v: i + 1, text});
    }));
  }

  const msg = $('startMsg');
  if(!arr.length){
    msg.textContent = '시험할 절이 없습니다. 범위나 절 선택을 확인하세요.';
    msg.classList.remove('hidden');
    return;
  }
  msg.classList.add('hidden');
  if(['first_random','blank_random','whole_random'].includes(mode)){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  qs = arr; idx = 0; scores = [];
  $('exam').classList.remove('hidden');
  $('summary').classList.add('hidden');
  show();
  $('exam').scrollIntoView({behavior: 'smooth', block: 'start'});
}

function refOf(q){
  return q.vStart ? `계시록 ${q.ch}:${q.vStart}~${q.vEnd}` : `계시록 ${q.ch}:${q.v}`;
}

function show(){
  const q = qs[idx], mode = $('mode').value, ref = refOf(q);
  $('progress').textContent = `문제 ${idx + 1} / ${qs.length}  ·  ${ref}`;
  let text = q.text;

  if(mode === 'first_random' || mode === 'first_order'){
    text = text.slice(0, Math.max(25, Math.floor(text.length * .28))) + ' ______';
  }
  if(mode === 'blank_random' || mode === 'blank_order'){
    const words = text.split(' ');
    const a = Math.max(1, Math.floor(words.length * .35));
    const used = new Set();
    while(used.size < a) used.add(Math.floor(Math.random() * words.length));
    used.forEach(j => words[j] = '______');
    text = words.join(' ');
  }
  if(mode === 'whole_random' || mode === 'whole_order' || mode === 'block_all'){
    text = ref + '을 암송하세요.';
  }

  $('question').textContent = text;
  $('answer').value = '';
  $('result').innerHTML = '';
  $('nextBtn').textContent = idx === qs.length - 1 ? '시험 마치기' : '다음 문제';
}

/* 띄어쓰기·문장부호 제거 후 비교 */
function norm(s){
  return s.replace(/[\s.,!?·"“”‘’'「」『』()]/g, '').replace(/\u00a0/g, '');
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j), cur = new Array(n + 1);
  for(let i = 1; i <= m; i++){
    cur[0] = i;
    for(let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function grade(){
  const q = qs[idx];
  const n = norm($('answer').value), t = norm(q.text);
  if(!n){ $('result').innerHTML = '<p class="small">답을 입력한 뒤 채점하세요.</p>'; return; }

  const pct = Math.max(0, Math.round((1 - levenshtein(n, t) / Math.max(n.length, t.length)) * 100));
  scores[idx] = pct;

  let same = 0;
  while(same < Math.min(n.length, t.length) && n[same] === t[same]) same++;
  const hint = same === t.length && n.length === t.length
    ? '완벽하게 일치합니다.'
    : `앞에서부터 ${same}자까지 일치 · 그 다음 정답 글자는 「${t.slice(same, same + 6) || '(끝)'}」`;

  $('result').innerHTML =
    `<p class="${pct >= 95 ? 'ok' : 'bad'}"><b>정확도 ${pct}%</b></p>
     <p class="small">${hint}<br>띄어쓰기와 문장부호는 무시하고 비교합니다.</p>`;
}
function showAnswer(){
  const q = qs[idx], parts = [];
  if(q.vStart){
    const chapter = raw[q.ch] || [];
    for(let v = q.vStart; v <= q.vEnd; v++){
      if(chapter[v - 1]) parts.push(`<div style="margin-bottom:12px"><b>${v}절</b><br>${chapter[v - 1]}</div>`);
    }
  } else {
    parts.push(`<div><b>${q.v}절</b><br>${q.text}</div>`);
  }
  $('result').innerHTML = `<div class="answerBox"><b>📖 정답</b><div style="margin-top:10px">${parts.join('')}</div></div>`;
}
function next(){
  if(idx < qs.length - 1){ idx++; show(); $('exam').scrollIntoView({behavior:'smooth',block:'start'}); }
  else finish();
}
function finish(){
  const valid = scores.filter(x => typeof x === 'number');
  const avg = valid.length ? Math.round(valid.reduce((a, b) => a + b, 0) / valid.length) : 0;
  $('exam').classList.add('hidden');
  $('summary').classList.remove('hidden');
  $('summary').innerHTML =
    `<h2>🎉 시험 종료</h2>
     <p>채점한 문제: ${valid.length}/${qs.length}</p>
     <p><b>평균 정확도: ${avg}%</b></p>
     <button class="block" id="againBtn">다시 시작</button>`;
  $('againBtn').addEventListener('click', () => document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'}));
  $('summary').scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* ---------- 이벤트 연결 ---------- */
$('range').addEventListener('change', buildVersePicker);
$('selectAll').addEventListener('click', () => {
  activeChapters().forEach(ch => raw[ch].forEach((_, i) => selectedVerses[ch + ':' + (i + 1)] = true));
  buildVersePicker();
});
$('clearAll').addEventListener('click', () => { selectedVerses = {}; buildVersePicker(); });
$('startBtn').addEventListener('click', start);
$('gradeBtn').addEventListener('click', grade);
$('answerBtn').addEventListener('click', showAnswer);
$('nextBtn').addEventListener('click', next);
buildVersePicker();
</script>
</div>
</body>
</html>
